# simple-jndi datasource for integration tests; kettle's JndiUtil points
# org.osjava.sj.root at the ./simple-jndi directory (working dir = core/ during ITs).
# The HSQLDB database script ships in src/it/resources/repo/.
SampleData/type=javax.sql.DataSource
SampleData/driver=org.hsqldb.jdbcDriver
SampleData/url=jdbc:hsqldb:file:./src/it/resources/repo/SampleData;shutdown=true
SampleData/user=SA
SampleData/password=
